<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>atelier結 予約</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: one section of at-yui.com — white ground, a centered head (script + Japanese), one bordered booking box. Sage from the homepage, one deeper sage for buttons. Light only, like the homepage. */
:root{
  --ink:#241913; --sub:#6B6259; --bg:#FFFFFF; --tint:#F7F6F3; --line:#E4E2DE; --field:#BDB8B1;
  --sage:#94BEB7; --sage-soft:#EFF6F4; --accent:#3B8072; --accent-dark:#2F6A5E;
  --few:#9A6A1F; --gone:#A8A39C; --pink:#A8455F;
  --script:'Caveat','Segoe Script',cursive;
  --jp:'游ゴシック体',YuGothic,'Yu Gothic','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',Meiryo,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--jp);font-weight:500;font-size:15px;line-height:2;letter-spacing:.04em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 96px}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.page{max-width:640px;margin-inline:auto}
.hd{display:flex;justify-content:center;padding:22px 0 18px;border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)))}
.hd img{width:150px;height:auto;display:block}
.head{text-align:center;padding:56px 0 32px}
.script{font-family:var(--script);color:var(--sage);font-size:34px;line-height:1.1;font-weight:600;letter-spacing:.02em}
.head h1,.head h2{margin-top:6px;font-size:22px;font-weight:700;letter-spacing:.16em;line-height:1.7}
.head .lead{margin-top:12px;color:var(--sub);font-size:14px}
.box{background:var(--bg);border:1px solid var(--line);padding:28px 20px}
@media (min-width:600px){.box{padding:40px 44px}}
.step{margin:36px 0 12px;font-weight:700;letter-spacing:.1em;display:flex;align-items:baseline;gap:10px}
.step:first-child{margin-top:0}
.step .n{font-family:'Helvetica Neue',Arial,sans-serif;color:var(--accent);font-weight:300;font-size:22px;line-height:1}
/* menu rows */
.menus{display:flex;flex-direction:column;gap:8px}
.menu{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--bg);border:1px solid #CFCAC3;padding:12px 14px;cursor:pointer;width:100%}
.menu .r{width:18px;height:18px;border-radius:50%;border:1px solid #9C968E;display:grid;place-items:center}
.menu b{display:block;font-size:15px;line-height:1.5}
.menu small{display:block;font-size:12px;color:var(--sub);line-height:1.5;font-weight:500}
.menu em{font-style:normal;font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.menu[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--sage-soft)}
.menu[aria-pressed="true"] .r{border-color:var(--accent)}
.menu[aria-pressed="true"] .r::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.menu.ck .r{border-radius:2px}
.menu.ck[aria-pressed="true"] .r{background:var(--accent)}
.menu.ck[aria-pressed="true"] .r::after{width:5px;height:9px;border-radius:0;background:none;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.occs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.occs .menu{grid-template-columns:1fr;gap:0;padding:12px 14px}
.occs .menu b{font-size:15px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:10px 14px;background:var(--tint);font-size:13px}
.total b{font-size:16px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.step small{font-weight:500;color:var(--sub);font-size:12px;letter-spacing:.02em}
.sub-box{border:1px solid var(--line);border-top:0;background:var(--tint);padding:14px 14px 16px;margin-top:-8px}
.sub-box .lab{font-size:13px;font-weight:700;margin:0 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid #C9C4BD;background:var(--bg);padding:10px 8px;font-weight:700;cursor:pointer;font-size:14px}
.seg button small{display:block;font-size:11px;font-weight:500;color:var(--sub);line-height:1.4}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--sage-soft);color:var(--accent-dark)}
.kimonos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kimono{border:1px solid #C9C4BD;background:var(--bg);padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-width:0;position:relative}
.kimono .sw{aspect-ratio:2/3;width:100%;display:block}
.kimono b{display:block;font-size:12px;line-height:1.5;padding:6px 8px 7px;font-weight:700;letter-spacing:.02em}
.kimono[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kimono[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;display:grid;place-items:center}
.kimono.consult{align-items:center;justify-content:center;border-style:dashed;background:var(--bg);min-height:100px}
.kimono.consult b{text-align:center;color:var(--accent);padding:14px 8px}
.kimono.consult small{font-size:11px;color:var(--sub);text-align:center;padding:0 8px 12px;line-height:1.5}
.sample{font-size:11px;color:var(--sub);margin-top:8px}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head b{font-size:15px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.nav{background:none;border:0;width:40px;height:36px;cursor:pointer;color:var(--accent);font-size:20px}
.nav:disabled{color:var(--line);cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.wd{text-align:center;font-size:11px;color:var(--sub);padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.wd.sun{color:var(--pink)} .wd.sat{color:#3D6FA3}
.day{background:none;border:0;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-variant-numeric:tabular-nums;min-width:0}
.day .n{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:14px;line-height:1}
.day .m{font-size:12px;line-height:1;height:12px;font-weight:700}
.day.ok .m{color:var(--accent)} .day.few .m{color:var(--few)} .day.full .m,.day.off .m{color:var(--gone);font-weight:500;font-size:11px}
.day.full .n,.day.off .n,.day.out .n{color:var(--gone)}
.day:disabled{cursor:default}
.day.blank{visibility:hidden}
.day.today .n{box-shadow:inset 0 0 0 1px var(--line)}
.day[aria-pressed="true"] .n{background:var(--accent);color:#fff;font-weight:700;box-shadow:none}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:2px 16px;font-size:12px;color:var(--sub);margin-top:10px}
.legend .ok{color:var(--accent);font-weight:700} .legend .few{color:var(--few);font-weight:700}
.picked{margin:22px 0 10px;font-weight:700;font-size:14px;letter-spacing:.08em}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t{min-height:46px;border:1px solid #C9C4BD;background:var(--bg);cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.t:disabled{border-color:var(--line);background:var(--tint);color:var(--gone);text-decoration:line-through;font-weight:500;cursor:default}
.t[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--sage-soft);color:var(--accent-dark)}
.hint{color:var(--sub);font-size:13px;text-align:center;padding:14px 0;background:var(--tint)}
/* fields */
label{display:block;font-weight:700;margin:18px 0 6px;font-size:14px}
label small{font-weight:500;color:var(--sub)}
.step+label{margin-top:0}
input[type=text],input[type=tel],input[type=date],input[type=time],select,textarea{width:100%;font:inherit;letter-spacing:.02em;padding:12px 14px;border:1px solid var(--field);border-radius:2px;background:var(--bg);color:var(--ink);font-size:16px}
textarea{resize:vertical;min-height:84px;line-height:1.7}
.agree{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin-top:22px;line-height:1.7;font-size:13px}
.agree input{width:auto;margin:4px 0 0;accent-color:var(--accent)}
.error{color:#B3261E;font-weight:700;margin:14px 0 0;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:58px;padding:0 32px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;letter-spacing:.14em;border:0;border-radius:2px;font-size:16px;cursor:pointer}
.btn::after{content:"";width:18px;height:1px;background:currentColor}
.btn:hover{background:var(--accent-dark)}
.btn.wide{width:100%;margin-top:24px}
.btn:disabled{opacity:.45;cursor:default}
.btn.plain::after{display:none}
.btn.ghost{background:var(--bg);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.ghost:hover{background:var(--sage-soft)}
.btn.danger{background:var(--pink)}
.done{text-align:center}
.done-title{margin-top:6px;font-size:20px;font-weight:700;letter-spacing:.12em}
.done-when{margin:12px 0 4px;font-size:24px;font-weight:700;color:var(--accent);letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1.5}
.done-menu{margin-bottom:18px}
.done p{font-size:14px}
.done .script{font-size:30px}
.ft{text-align:center;color:var(--sub);font-size:12px;padding:40px 0 0;line-height:1.8}
.offline{font-size:12px;color:var(--few);text-align:center;margin-top:12px}
/* LINE (見本) */
.chat{background:#8EA8C6;padding:16px 12px 20px;display:flex;flex-direction:column;gap:14px;min-height:60vh}
.chat-h{text-align:center;font-size:13px;font-weight:700;color:#14202E;letter-spacing:.06em}
.msg{display:flex;gap:8px;align-items:flex-end}
.av{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.av img{width:32px;height:auto}
.bub{background:#fff;border-radius:16px 16px 16px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;max-width:84%;min-width:0;line-height:1.6}
.bub .k{font-size:12px;font-weight:700;color:var(--pink)}
.bub .when{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.bub p{font-size:14px}
.bub a{margin-top:8px;display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;font-weight:700;font-size:14px;border-radius:6px;padding:8px;letter-spacing:.08em}
.stamp{font-size:11px;color:#14202E;white-space:nowrap}
.sep{align-self:center;font-size:11px;background:rgba(20,32,46,.25);color:#fff;border-radius:999px;padding:0 10px}
/* owner */
.o-head{display:flex;align-items:baseline;justify-content:space-between;padding:28px 0 16px;gap:12px}
.o-head h1{font-size:20px;font-weight:700;letter-spacing:.14em}
.o-head span{font-size:13px;color:var(--sub)}
.o-today{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin-bottom:20px}
.o-today div{padding:12px 14px;min-width:0}
.o-today div+div{border-left:1px solid var(--line)}
.o-today small{display:block;font-size:12px;color:var(--sub);line-height:1.6}
.o-today b{display:block;font-size:24px;line-height:1.4;font-variant-numeric:tabular-nums}
.oday .m{color:var(--accent);font-size:11px;font-weight:700}
.oday.off .m{color:var(--gone);font-weight:500}
.d-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:28px 0 8px}
.d-head h2{font-size:17px;font-weight:700;letter-spacing:.1em}
.list{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;text-decoration:none;color:inherit;border-bottom:1px solid var(--line);padding:12px 2px;line-height:1.5}
.item .tm{font-weight:700;font-variant-numeric:tabular-nums}
.item .tm small{display:block;color:var(--sub);font-weight:500;font-size:12px}
.item b{display:block;font-size:15px}
.item span span{font-size:12px;color:var(--sub)}
.item.cx{opacity:.45} .item.cx b{text-decoration:line-through}
.empty{color:var(--sub);font-size:13px;padding:14px 2px;border-bottom:1px solid var(--line)}
.src{font-size:11px;font-weight:700;padding:1px 8px;white-space:nowrap;border:1px solid currentColor;color:var(--accent);letter-spacing:.06em}
.src.phone{color:#7A5A2B} .src.insta{color:var(--pink)} .src.mail{color:#3D6FA3} .src.walkin{color:var(--sub)}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:6;width:min(608px, calc(100% - 32px));box-shadow:0 8px 20px rgba(36,25,19,.18)}
/* detail */
.back{display:inline-block;margin:24px 0 8px;color:var(--accent);font-size:13px;text-decoration:none}
.when-big{font-size:22px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1.5}
.dl{display:grid;grid-template-columns:96px 1fr;margin:18px 0 0;border-top:1px solid var(--line);line-height:1.7}
.dl dt,.dl dd{border-bottom:1px solid var(--line);padding:11px 2px;margin:0}
.dl dt{color:var(--sub);font-size:13px}
.dl dd{min-width:0;overflow-wrap:anywhere}
.tel{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tel code{font-family:var(--jp);font-size:18px;font-weight:700;letter-spacing:.06em;user-select:all}
.mini{border:1px solid var(--accent);color:var(--accent);background:var(--bg);padding:2px 10px;font-size:12px;cursor:pointer}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:0 10px;border:1px solid var(--accent);color:var(--accent);letter-spacing:.08em}
.badge.cancelled{border-color:var(--gone);color:var(--sub)} .badge.done{background:var(--accent);color:#fff}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.acts .btn{padding:0 10px;min-height:52px;font-size:15px}
.confirm{background:#FBF0F3;padding:16px;margin-top:22px;display:flex;flex-direction:column;gap:12px;font-size:14px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(36,25,19,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(640px,100%);max-height:calc(100% - 24px - env(safe-area-inset-top, 0px));overflow:auto;padding:22px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h2{font-size:18px;font-weight:700;letter-spacing:.12em}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--sub);width:40px;height:40px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #C9C4BD;background:var(--bg);padding:6px 14px;font-size:14px;cursor:pointer;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--sage-soft);color:var(--accent-dark)}
.sheet .times{margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:#fff;padding:10px 18px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);line-height:1.6}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>

function garment(k,c){
  const [base,pat,obi]=c, line='rgba(36,25,19,.22)', cream='#F6F1E8';
  const dots=(xs,ys,r,col)=>xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="${r}" fill="${col}" opacity=".9"/>`).join('');
  const sleeveB=k==='furisode'?150:k==='yukata'?72:k==='hifu'||k==='child'||k==='boy'?80:90;  // 袖の下端

  const sleeves=`<path d="M${shL} ${neck} L10 ${neck+6} L10 ${sleeveB} L${shL} ${sleeveB-4} Z" fill="${base}" stroke="${line}" stroke-width="1"/><path d="M${shR} ${neck} L110 ${neck+6} L110 ${sleeveB} L${shR} ${sleeveB-4} Z" fill="${base}" stroke="${line}" stroke-width="1"/>`;
  const collar=`<path d="M52 ${neck-2} L60 70 L68 ${neck-2}" fill="none" stroke="${cream}" stroke-width="5" stroke-linejoin="round"/><path d="M52 ${neck-2} L60 70 L68 ${neck-2}" fill="none" stroke="${line}" stroke-width=".8"/>`;
  const hanger=`<path d="M60 8 L60 ${neck} M60 8 q-3 -6 3 -6" fill="none" stroke="#9A948C" stroke-width="1.5"/>`;
  const pattern=k==='boy'?'':dots([30,78,54,92,22,66],[120,140,160,100,150,135],k==='furisode'||k==='kimono'?6:5,pat)+dots([20,100],[110,122],3.5,obi)+(k==='furisode'?dots([18,102,24,96],[100,120,135,142],4,pat):'');
  const obiBand=`<rect x="36" y="76" width="48" height="20" fill="${obi}" stroke="${line}" stroke-width=".8"/><line x1="36" y1="86" x2="84" y2="86" stroke="${pat}" stroke-width="2"/>`;
  if(k==='hakama'){
    const top=`<path d="M${shL} ${neck} L${shR} ${neck} L88 92 L32 92 Z" fill="${base}" stroke="${line}" stroke-width="1"/>`;
    const skirt=`<path d="M30 88 L90 88 L104 ${hem} L16 ${hem} Z" fill="${obi}" stroke="${line}" stroke-width="1"/>`+[40,52,64,76].map(x=>`<line x1="${x}" y1="92" x2="${x+(x<60?-8:8)}" y2="${hem}" stroke="rgba(0,0,0,.18)" stroke-width="1"/>`).join('')+`<rect x="30" y="84" width="60" height="8" fill="${obi}" stroke="${line}" stroke-width=".8"/><path d="M60 92 L56 108 L64 108 Z" fill="${cream}" opacity=".8"/>`;
    return svgWrap(hanger+`<path d="M${shL} ${neck} L10 ${neck+6} L10 ${sleeveB} L${shL} ${sleeveB-4} Z" fill="${base}" stroke="${line}" stroke-width="1"/><path d="M${shR} ${neck} L110 ${neck+6} L110 ${sleeveB} L${shR} ${sleeveB-4} Z" fill="${base}" stroke="${line}" stroke-width="1"/>`+top+dots([24,96,46,74],[60,66,52,58],4,pat)+skirt+collar);
  }
  if(k==='hifu'){
    const vest=`<path d="M40 ${neck+2} L80 ${neck+2} L86 104 L34 104 Z" fill="${pat}" stroke="${line}" stroke-width="1"/><circle cx="60" cy="62" r="5" fill="${cream}"/><circle cx="60" cy="80" r="5" fill="${cream}"/>`;
    return svgWrap(hanger+sleeves+body+dots([30,90,50,70],[130,150,160,120],5,pat)+dots([24,96],[115,135],3,obi)+vest+`<path d="M52 ${neck} L60 60 L68 ${neck}" fill="none" stroke="${cream}" stroke-width="5" stroke-linejoin="round"/>`);
  }
  if(k==='boy'){
    const hak=`<path d="M30 92 L90 92 L104 ${hem} L16 ${hem} Z" fill="${obi}" stroke="${line}" stroke-width="1"/>`+[44,60,76].map(x=>`<line x1="${x}" y1="96" x2="${x+(x<60?-8:x>60?8:0)}" y2="${hem}" stroke="rgba(0,0,0,.2)" stroke-width="1"/>`).join('');
    const haori=`<path d="M${shL} ${neck} L${shR} ${neck} L90 118 L30 118 Z" fill="${base}" stroke="${line}" stroke-width="1"/>`+`<path d="M46 ${neck} L46 118 M74 ${neck} L74 118" stroke="rgba(255,255,255,.12)" stroke-width="3"/>`+`<path d="M52 ${neck-2} L60 64 L68 ${neck-2}" fill="none" stroke="${cream}" stroke-width="4"/>`+`<path d="M50 74 q10 4 20 0" fill="none" stroke="${pat}" stroke-width="2.5"/><circle cx="50" cy="78" r="2.5" fill="${pat}"/><circle cx="70" cy="78" r="2.5" fill="${pat}"/>`+dots([24,96],[70,64],4,pat);
    return svgWrap(hanger+sleeves+hak+haori);
  }
  return svgWrap(hanger+sleeves+body+pattern+obiBand+collar);
}

    out.push(t);
  }
  return out;
}

  if(aSvcs.length)$('a-total').innerHTML=`<span>${esc(svcNames(aOcc,aSvcs,aK?aKm:null))}</span><b>合計 約${dur(totalMin(aOcc,aSvcs,aK?aKm:null))}</b>`;
  const s=$('a-date').value, len=aSvcs.length?totalMin(aOcc,aSvcs,aK?aKm:null):60;
  if(!s){$('a-times').innerHTML='<p class="empty" style="grid-column:1/-1">日にちを選んでください</p>';return}
  const free=freeStarts(s,len,{owner:true});
  if(aTime!=null&&!free.includes(aTime))aTime=null;
  $('a-times').innerHTML=free.length?free.map(m=>`<button type="button" class="t" data-atime="${m}" aria-pressed="${aTime===m}">${show(hhmm(m))}</button>`).join(''):'<p class="empty" style="grid-column:1/-1">空いている時間がありません。下の「ほかの時間」に入れてください</p>';
}
$('fab').onclick=openSheet;
$('a-close').onclick=closeSheet;
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});
$('a-occ').onchange=()=>{aOcc=$('a-occ').value;aSvcs=occOf(aOcc).lesson?[]:(aOcc==='other'?[]:['kitsuke','hair']);aKm={source:'own',item:null};aTime=null;renderSheet()};$('a-date').onchange=()=>{aTime=null;renderSheet()};
$('a-time-free').oninput=()=>{aTime=null;renderSheet()};
$('a-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=msg=>{$('a-err').textContent=msg;$('a-err').hidden=false};
  const aK2=!occOf(aOcc).lesson&&aSvcs.includes('kitsuke'), km2=aK2?aKm:null;
  const s=$('a-date').value, name=$('a-name').value.trim(), len=totalMin(aOcc,aSvcs,km2);
  const free=$('a-time-free').value, start=free?toMin(free):aTime;
  if(!aSvcs.length)return err('メニューを選んでください。');
  if(!s)return err('日にちを選んでください。');
  if(start==null||isNaN(start))return err('時間を選ぶか、ほかの時間を入れてください。');
  if(!name)return err('お名前を入れてください。');
  const clash=bookings.some(b=>b.date===s&&active(b)&&start<toMin(b.end)&&start+len>toMin(b.start));
  $('a-save').disabled=true;
  try{
    await saveBooking({date:s,start:hhmm(start),end:hhmm(start+len),occasion:aOcc,services:aSvcs,kimono:km2,label:occOf(aOcc).name+'｜'+svcNames(aOcc,aSvcs,km2),name,tel:$('a-tel').value.trim(),contact:aSrc==='phone'?'お電話':SRC[aSrc],email:aSrc==='mail'?$('a-mail').value.trim():'',note:$('a-note').value.trim(),source:aSrc,status:'booked'});
    closeSheet();k.date=s;k.month=monthStart(s);renderOwner();
    toast(clash?'入れました（ほかの予約と時間が重なっています）':`${dshort(s)} ${show(hhmm(start))}〜 を入れました`);
  }catch(x){err('保存できませんでした。もう一度お試しください。')}
  $('a-save').disabled=false;
});

/* ---------- 保存 ---------- */
async function saveBooking(b){
  const id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const body={...b,createdAt:new Date().toISOString()};
  if(db)await db.collection('bookings').doc(id).set(body);
  else{bookings.push({id,...body});localSave();render()}
  return id;
}
async function updateBooking(id,patch){
  if(db)await db.doc('bookings/'+id).update(patch);
  else{Object.assign(bookings.find(b=>b.id===id),patch);localSave();render()}
}

/* ---------- 画面の切り替え（#kanri・#line・#y-予約） ---------- */
const VIEWS=['yoyaku','line','kanri','detail'];
let view='yoyaku';
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  view=h.startsWith('y-')?'detail':(VIEWS.includes(h)?h:'yoyaku');
  detailId=view==='detail'?h.slice(2):null; confirmCancel=false;
  for(const v of VIEWS)$('v-'+v).hidden=v!==view;
  $('fab').hidden=view!=='kanri';
  if(view==='detail'){const b=bookings.find(x=>x.id===detailId);if(b){k.date=b.date;k.month=monthStart(b.date)}}
  render();window.scrollTo({top:0});
}
function render(){
  if(view==='yoyaku')renderCustomer();
  else if(view==='line')renderLine();
  else if(view==='kanri')renderOwner();
  else renderDetail();
}
window.addEventListener('hashchange',route);
$('reset-demo').onclick=()=>{try{localStorage.removeItem(LS_KEY)}catch(x){} localLoad();render();toast('見本の予約に戻しました')};
route();

(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(x){db=null}
  if(!db){localLoad();$('offline').hidden=false;loaded=true;render();return}
  db.collection('bookings').onSnapshot(s=>{bookings=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;
    if(view==='detail'){const b=bookings.find(x=>x.id===detailId);if(b){k.date=b.date;k.month=monthStart(b.date)}}
    render()},()=>toast('予約を読み込めませんでした。開き直してください'));
  db.doc('settings/shop').onSnapshot(s=>{closedDays=(s.exists&&Array.isArray(s.data().closedDays))?s.data().closedDays:[];render()},()=>{});
})();
</script>
